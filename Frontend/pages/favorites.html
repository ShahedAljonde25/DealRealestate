<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites - DealRealState</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/pages/favorites.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div id="navbar-placeholder"></div>

    <!-- Main Content Section -->
    <!-- 💡 تمت إضافة mt-5 و pt-5 لدفع المحتوى للأسفل وإبعاده عن النافبار -->
    <main class="featured-section container mt-5 pt-5">
        
        <div class="section-title text-center mb-5"> <!-- 💡 توسيط العنوان وإضافة مسافة سفلية -->
            <h2><i class="fa-solid fa-heart text-danger"></i> My Favorite Properties</h2>
            <p class="text-muted">Manage the properties you have saved to your favorites list.</p>
        </div>

        <!-- Alert Container -->
        <div id="alertContainer"></div>

        <!-- Grid Container -->
        <!-- 💡 تمت إضافة row و g-4 لترتيب العناصر كشبكة منتظمة عبر البوتستراب -->
        <div class="row g-4 properties-grid" id="favoritesContainer">
            
            <!-- Loading State -->
            <div class="col-12 text-center p-5" id="loadingSpinner">
                <div class="spinner-border text-success" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- 💡 تم إضافة type="module" لأن ملف الجافاسكريبت يحتوي على import -->
    <script type="module" src="../js/pages/favorites.js"></script>
    <script src="../js/load_components.js"></script>

</body>
</html>
